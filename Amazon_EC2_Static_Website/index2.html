<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A126023 AWS Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.28) 0%,
                    rgba(0, 0, 0, 0.08) 42%,
                    rgba(0, 0, 0, 0.05) 68%,
                    rgba(0, 0, 0, 0.18) 100%
                ),
                url("My_Day.png") center center / cover fixed no-repeat;
        }

        /* =========================
           Header
           ========================= */

        header {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;

            width: 100%;
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7.5%;

            background: rgba(255, 255, 255, 0.10);

            border-top: 3px solid rgba(255, 255, 255, 0.55);
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.5px;

            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
        }

        .logo-id {
            color: #ffffff;
        }

        .logo-title {
            color: #f0ba3a;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;

            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }

        nav a:hover {
            color: #ffd96d;
            transform: translateY(-1px);
        }

        /* =========================
           Hero Section
           ========================= */

        .hero {
            min-height: 100vh;

            /*
             * Content is intentionally shifted toward the left
             * so the person in the center of My_Day.png remains visible.
             */
            padding: 135px 6.5% 60px 3.6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 34px;
        }

        .hero-content {
            width: min(575px, 42vw);

            padding: 0;

            background: transparent;
            border: none;
            box-shadow: none;

            position: relative;
            z-index: 5;
        }

        .eyebrow {
            display: inline-block;

            margin-bottom: 20px;

            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.7px;

            color: #ffd15b;

            text-shadow:
                0 2px 7px rgba(0, 0, 0, 0.65);
        }

        .hero h1 {
            font-size: clamp(46px, 5vw, 69px);
            line-height: 0.98;
            letter-spacing: -3px;
            font-weight: 800;

            color: #ffffff;

            text-shadow:
                0 4px 13px rgba(0, 0, 0, 0.65);
        }

        .hero h1 .highlight {
            display: block;

            margin-top: 5px;

            color: #6b80ff;

            text-shadow:
                0 4px 13px rgba(0, 0, 0, 0.48);
        }

        .description {
            max-width: 550px;

            margin-top: 27px;

            font-size: 18px;
            line-height: 1.55;

            color: #ffffff;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.72);
        }

        /* =========================
           Project Button
           ========================= */

        .project-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            margin-top: 29px;

            min-width: 145px;
            height: 54px;

            padding: 0 24px;

            border-radius: 8px;

            background: #5268e7;
            color: #ffffff;

            font-size: 16px;
            font-weight: 700;

            text-decoration: none;

            box-shadow:
                0 7px 18px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .project-button:hover {
            background: #4059d8;

            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(0, 0, 0, 0.30);
        }

        /* =========================
           EC2 Status Card
           ========================= */

        .status-card {
            width: 295px;
            min-width: 295px;

            margin-right: 2.5%;

            padding: 35px 30px;

            border-radius: 18px;

            background: rgba(20, 24, 33, 0.20);

            border: 1px solid rgba(255, 255, 255, 0.28);

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.18);

            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;

            position: relative;
            z-index: 5;
        }

        .cloud-icon {
            width: 82px;
            height: 82px;

            border-radius: 50%;

            background: rgba(255, 247, 221, 0.90);

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 23px;
        }

        .cloud-icon svg {
            width: 40px;
            height: 40px;

            fill: #172033;
        }

        .status-card h2 {
            font-size: 25px;
            line-height: 1.2;

            color: #ffffff;

            margin-bottom: 10px;

            text-shadow:
                0 2px 6px rgba(0, 0, 0, 0.55);
        }

        .server-type {
            font-size: 17px;

            color: #ffffff;

            margin-bottom: 23px;

            text-shadow:
                0 2px 6px rgba(0, 0, 0, 0.48);
        }

        .running-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 16px;

            border-radius: 30px;

            background: rgba(239, 252, 243, 0.93);
            color: #39764d;

            font-size: 14px;
            font-weight: 700;
        }

        .running-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #48a868;
        }

        /* =========================
           Responsive
           ========================= */

        @media (max-width: 1000px) {
            header {
                padding: 0 5%;
            }

            .hero {
                padding-left: 3.5%;
                padding-right: 5%;
                gap: 25px;
            }

            .hero-content {
                width: 54vw;
            }

            .status-card {
                width: 270px;
                min-width: 270px;

                margin-right: 0;
            }

            nav {
                gap: 20px;
            }
        }

        @media (max-width: 800px) {
            header {
                height: auto;
                min-height: 78px;

                padding: 18px 5%;

                flex-direction: column;
                gap: 14px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                min-height: 100vh;

                padding:
                    135px 5% 55px;

                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
            }

            .hero-content {
                width: min(620px, 100%);
            }

            .hero h1 {
                font-size: clamp(48px, 10vw, 68px);
            }

            .description {
                max-width: 620px;
            }

            .status-card {
                align-self: flex-end;

                width: 280px;
                min-width: 280px;
            }
        }

        @media (max-width: 520px) {
            .logo {
                font-size: 21px;
            }

            nav {
                gap: 14px;
            }

            nav a {
                font-size: 13px;
            }

            .hero {
                padding:
                    140px 5% 50px;
            }

            .hero h1 {
                font-size: 48px;
                letter-spacing: -2px;
            }

            .description {
                font-size: 17px;
            }

            .status-card {
                align-self: center;

                width: 100%;
                min-width: 0;
                max-width: 330px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         Header
         ========================= -->

    <header>

        <div class="logo">
            <span class="logo-id">A126023</span>
            <span class="logo-title">AWS Project</span>
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#project">Project</a>
            <a href="#contact">Contact</a>
        </nav>

    </header>


    <!-- =========================
         Main Hero
         ========================= -->

    <main>

        <section class="hero" id="home">

            <div class="hero-content">

                <div class="eyebrow">
                    AMAZON EC2&nbsp; • &nbsp;STATIC WEBSITE
                </div>

                <h1>
                    My First Website
                    <span class="highlight">
                        Hosted on AWS
                    </span>
                </h1>

                <p class="description">
                    A simple static website deployed on an Ubuntu Amazon EC2
                    instance using the Apache web server.
                </p>

                <a
                    class="project-button"
                    href="https://github.com/SUMITXP10/Cloud-Computing"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View Project
                </a>

            </div>


            <!-- =========================
                 EC2 Card
                 ========================= -->

            <div class="status-card">

                <div class="cloud-icon">

                    <svg
                        viewBox="0 0 64 64"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >
                        <path d="
                            M46.5 49
                            H18.2
                            C12 49
                            7 44.2
                            7 38.2
                            C7 32.7
                            11.4 28.2
                            17.1 27.6
                            C19.3 20
                            26.3 14.5
                            34.4 14.5
                            C44 14.5
                            51.9 22
                            52.5 31.4
                            C55.4 32.8
                            57.4 35.9
                            57.4 39.4
                            C57.4 44.8
                            53.1 49
                            46.5 49
                            Z
                        " />
                    </svg>

                </div>

                <h2>
                    Amazon EC2
                </h2>

                <div class="server-type">
                    Ubuntu Server
                </div>

                <div class="running-badge">
                    <span class="running-dot"></span>
                    Apache Running
                </div>

            </div>

        </section>

    </main>

</body>
</html>
